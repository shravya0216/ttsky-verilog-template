# Tiny Tapeout project information
project:
  title:       "5-Stage Pipelined MIPS with I2C/MMIO Loader"  # EDIT: your real title
  author:      "YOUR NAME HERE"                                # EDIT
  discord:     "your_discord_username"                         # EDIT (optional)
  description: "A 5-stage pipelined MIPS-style CPU with forwarding, hazard stalling, and branch prediction, programmable and controllable over I2C via a memory-mapped IO loader (instruction memory, data memory, and register file are all dynamically loadable)."
  language:    "Verilog"
  clock_hz:    10000000        # matches CLOCK_PERIOD=40 in config.json (100ns = 10MHz)

  # TILE SIZE: set to 8x2, the largest standard option, deliberately with
  # margin to spare. Reasoning: the last hardening attempt crashed during
  # Yosys elaboration (BHT/BTB/PHT module-name collision, now fixed) before
  # ever reaching floorplanning, so there is still no real utilization
  # number from the tool itself. A hand-derived estimate of the design's
  # register/memory content (mechanically counted from the actual source)
  # plus its combinational logic came out to roughly 68% of the 8x2 budget
  # -- comfortable margin, but explicitly an ESTIMATE, not a synthesis
  # measurement. Smaller options (4x2, 6x2) were estimated close to or
  # over their own budgets in earlier passes of that analysis. Once a real
  # utilization number comes back from this run, this can be safely
  # reduced if it's far under budget -- but 8x2 is the safe starting point
  # to avoid a second area-related failure.
  tiles: "4x3"   # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_".
  top_module: "tt_um_mips_i2c"

  # Every file the design uses -- a missing entry here causes an "unknown
  # module" error during synthesis, the same class of failure as the
  # earlier Icarus "unknown module" errors seen in local checks.
  source_files:
    - "tt_um_mips_i2c.v"
    - "top.v"
    - "i2c_slave_mmio.v"
    - "mmio_decoder.v"
    - "data_memory.v"
    - "instruction_memory.v"
    - "reg_file.v"
    - "ALU.v"
    - "BHT.v"
    - "BTB.v"
    - "branching_unit.v"
    - "comparator.v"
    - "control_unit.v"
    - "EX_MEM_register.v"
    - "Flushing_unit.v"
    - "forward_rt.v"
    - "Forwarding_unit.v"
    - "Forward_rs.v"
    - "ID_EX_register.v"
    - "IF_ID_register.v"
    - "M_WB_register.v"
    - "mux_1.v"
    - "mux_1_execution.v"
    - "mux_2.v"
    - "mux_2_execution.v"
    - "mux_3_execution.v"
    - "Pc.v"
    - "PHT.v"
    - "Sign_extender.v"
    - "stalling_unit.v"
    - "Write_back_mux.v"
    - "Xor_result.v"

  # The pinout of your project. Must match tt_um_mips_i2c.v exactly.
pinout:
  ui[0]: "scl"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  uo[0]: "led"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""
  uio[0]: "sda"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
